[versions]
minecraft = "26.1.2"
neoForge = "26.1.2.75"
# AnvilLib / Ageratum 的版本刻意与 AnvilCraft 1.6.0+snapshot.2284 的 POM 对齐，
# 而不是取各自的最新版：AnvilCraft 是编译时依赖，版本错配会导致运行时 NoSuchMethodError。
anvillib = "2.0.0+snapshot.519"
ageratum = "0.0.1+build.109"
anvilcraft = "1.6.0+snapshot.2284"
jei = "29.6.2.31"
modDevGradle = "2.0.141"
lombok = "8.7.1"

[libraries]
anvillib = { group = "dev.anvilcraft.lib", name = "anvillib-neoforge-26.1", version.ref = "anvillib" }
ageratum = { group = "dev.anvilcraft.resource", name = "ageratum-neoforge-26.1.2", version.ref = "ageratum" }
anvilcraft = { group = "dev.dubhe", name = "anvilcraft-neoforge-26.1.2", version.ref = "anvilcraft" }
jeiCommonApi = { group = "mezz.jei", name = "jei-26.1.2-common-api", version.ref = "jei" }
jeiNeoForgeApi = { group = "mezz.jei", name = "jei-26.1.2-neoforge-api", version.ref = "jei" }
jeiNeoForge = { group = "mezz.jei", name = "jei-26.1.2-neoforge", version.ref = "jei" }

[plugins]
modDevGradle = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
